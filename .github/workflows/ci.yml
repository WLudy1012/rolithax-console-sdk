name: Build and verify Rolithax Schema SDK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: schema-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-2025, target: windows-x64 }
          - { runner: macos-15-intel, target: macos-x64 }
          - { runner: macos-15, target: macos-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.ROLITHAX_RUNTIME_REPOSITORY || 'WLudy1012/RolithaxLauncher' }}
          ref: ${{ vars.ROLITHAX_RUNTIME_REF || 'dbc90e4d91704cd66d75d8046957e045fd17673d' }}
          path: .rolithax-runtime
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build shared native runtime
        run: |
          cmake -S .rolithax-runtime/native/schema -B build/native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/native --config Release --parallel
          ctest --test-dir build/native -C Release --output-on-failure
      - name: Resolve native CLI
        shell: python
        run: |
          import os
          from pathlib import Path
          name = "rolithax-schema.exe" if os.name == "nt" else "rolithax-schema"
          binary = next(path for path in Path("build/native").rglob(name) if path.is_file()).resolve()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ROLITHAX_SCHEMA_CLI={binary}\n")
              env.write(f"ROLITHAX_NATIVE_DIR={binary.parent}\n")
      - name: Validate wrapper and both native engines
        run: python -m unittest discover -s tests -v
      - name: Check bundled native protocol
        run: python rolithax_schema_sdk.py doctor
      - name: Bundle SDK
        shell: python
        run: |
          import os
          import subprocess
          subprocess.run(["python", "tools/bundle_sdk.py", os.environ["ROLITHAX_NATIVE_DIR"], "rolithax-schema-sdk.zip"], check=True)
      - uses: actions/upload-artifact@v7
        with:
          name: rolithax-schema-sdk-${{ matrix.target }}
          path: rolithax-schema-sdk.zip
          if-no-files-found: error
